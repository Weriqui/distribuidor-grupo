# Cloud Build pipeline para Cloud Run.
# Uso:  gcloud builds submit --config=cloudbuild.yaml
#
# Idempotente: cria o serviço na primeira execução e atualiza-o nas
# seguintes. Cobre Artifact Registry, build, push e deploy em um único
# `gcloud builds submit`.
#
# Antes do PRIMEIRO deploy, leia a seção "Deploy no Cloud Run" do README.md
# e configure as APIs, secrets e IAM uma única vez.

substitutions:
  # Identidade do serviço
  _SERVICE: distribuidor-grupo
  _REGION: southamerica-east1
  _AR_REPO: distribuidor-grupo

  # Recursos do Cloud Run (ajuste conforme necessidade)
  _MEMORY: "512Mi"
  _CPU: "1"
  _MAX_INSTANCES: "1"
  _MIN_INSTANCES: "0"
  _CONCURRENCY: "20"
  _TIMEOUT: "300"

  # Configuração da aplicação (não-secreta)
  _ALLOWED_ORIGINS: "*"
  _FILTER_OWNER_IDS: "14284568,23639057"
  _FILTER_NAME_SUFFIX: " (FILTRO)"
  _ORG_FETCH_WORKERS: "12"

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:$BUILD_ID"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest"

steps:
  # 1) Garante o repositório do Artifact Registry (idempotente).
  - id: ensure-repo
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if ! gcloud artifacts repositories describe "${_AR_REPO}" \
              --location="${_REGION}" >/dev/null 2>&1; then
          echo "→ Criando Artifact Registry repo ${_AR_REPO} em ${_REGION}…"
          gcloud artifacts repositories create "${_AR_REPO}" \
            --repository-format=docker \
            --location="${_REGION}" \
            --description="Distribuidor de Leads — Grupo Villela"
        else
          echo "→ Repo ${_AR_REPO} já existe."
        fi

  # 2) Build da imagem (com cache de layer Docker).
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:$BUILD_ID
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest
      - .

  # 3) Push para o Artifact Registry.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}

  # 4) Deploy em Cloud Run. `gcloud run deploy` cria o serviço se não existir
  #    e atualiza-o se já existir. Mesmas flags servem para os dois casos.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --concurrency=${_CONCURRENCY}
      - --timeout=${_TIMEOUT}
      - --max-instances=${_MAX_INSTANCES}
      - --min-instances=${_MIN_INSTANCES}
      # Para ligar auth via X-API-Key:
      #   1) crie o secret:  echo -n "STRING_LONGA" | gcloud secrets create app-api-key --data-file=-
      #   2) dê acesso:      gcloud secrets add-iam-policy-binding app-api-key --member=serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com --role=roles/secretmanager.secretAccessor
      #   3) substitua a linha abaixo por:
      #      - --set-secrets=PIPEDRIVE_API_TOKEN=pipedrive-api-token:latest,APP_API_KEY=app-api-key:latest
      - --set-secrets=PIPEDRIVE_API_TOKEN=pipedrive-api-token:latest
      - --set-env-vars=^@@^ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}@@PIPEDRIVE_FILTER_OWNER_IDS=${_FILTER_OWNER_IDS}@@PIPEDRIVE_FILTER_NAME_SUFFIX=${_FILTER_NAME_SUFFIX}@@PIPEDRIVE_ORG_FETCH_WORKERS=${_ORG_FETCH_WORKERS}
